# Base de datos local para desarrollo y pruebas (B-02). Solo datos inventados.
services:
  postgres:
    image: postgres:17-bookworm
    container_name: sistema-dental-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dental_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_dental}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
